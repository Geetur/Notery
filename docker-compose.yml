
services:
  # database
  postgres:
    image:  postgres:16-alpine
    container_name: notery_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # cache
  redis:
    image: redis:7-alpine
    container_name: notery_cache
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  # search engine
  meilisearch:
    image: getmeili/meilisearch:v1.0.0
    container_name: notery_search
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/data.ms

  # local S3-compatible storage (dev replacement for Cloudflare R2)
  minio:
    image: minio/minio:latest
    container_name: notery_storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Auto-create the default bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/notery-pdfs --ignore-existing;
      echo 'Bucket created';
      "

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:
