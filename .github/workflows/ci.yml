name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: notery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d notery_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      meilisearch:
        image: getmeili/meilisearch:v1.0.0
        env:
          MEILI_MASTER_KEY: testmasterkey
        ports:
          - 7700:7700

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_NAME: notery_test
          DB_SSLMODE: disable
          DB_TIMEZONE: UTC
          REDIS_ADDR: localhost:6379
          REDIS_PASSWORD: ""
          REDIS_DB: 0
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_MASTER_KEY: testmasterkey
          MEILISEARCH_INDEX: notes_test
          JWT_SECRET: test-jwt-secret-key
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build application
        run: go build -v -o notery ./cmd/api

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: notery-binary
          path: notery

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: notery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d notery_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      meilisearch:
        image: getmeili/meilisearch:v1.0.0
        env:
          MEILI_MASTER_KEY: testmasterkey
        ports:
          - 7700:7700

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: notery-binary

      - name: Make binary executable
        run: chmod +x notery

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U testuser; do sleep 2; done
          echo "Waiting for Redis..."
          until redis-cli -h localhost ping; do sleep 2; done
          echo "Waiting for Meilisearch..."
          until curl -s http://localhost:7700/health | grep -q available; do sleep 2; done
          echo "All services ready!"

      - name: Start API server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_NAME: notery_test
          DB_SSLMODE: disable
          DB_TIMEZONE: UTC
          REDIS_ADDR: localhost:6379
          REDIS_PASSWORD: ""
          REDIS_DB: 0
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_MASTER_KEY: testmasterkey
          MEILISEARCH_INDEX: notes_test
          JWT_SECRET: test-jwt-secret-key
        run: |
          ./notery &
          echo "Waiting for API server to start..."
          sleep 5
          until curl -s http://localhost:8080/health | grep -q OK; do sleep 2; done
          echo "API server is ready!"

      - name: Run API endpoint tests
        run: |
          echo "=== Testing Health Endpoint ==="
          curl -sf http://localhost:8080/health | jq .

          echo ""
          echo "=== Testing User Signup ==="
          SIGNUP_RESPONSE=$(curl -sf -X POST http://localhost:8080/api/v1/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"testpassword123"}')
          echo "$SIGNUP_RESPONSE" | jq .

          echo ""
          echo "=== Testing User Login ==="
          LOGIN_RESPONSE=$(curl -sf -X POST http://localhost:8080/api/v1/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"testpassword123"}')
          echo "$LOGIN_RESPONSE" | jq .
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.token')

          echo ""
          echo "=== Testing Protected Route (Create Note) ==="
          NOTE_RESPONSE=$(curl -sf -X POST http://localhost:8080/api/v1/notes \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"subnotery_name":"test-subnotery","title":"Test Note","author":"Test Author","price":9.99}')
          echo "$NOTE_RESPONSE" | jq .
          NOTE_ID=$(echo "$NOTE_RESPONSE" | jq -r '.id')

          echo ""
          echo "=== Testing Get Note by ID ==="
          curl -sf http://localhost:8080/api/v1/notes/$NOTE_ID \
            -H "Authorization: Bearer $TOKEN" | jq .

          echo ""
          echo "=== Testing Get Approved Notes ==="
          curl -sf http://localhost:8080/api/v1/notes/approved \
            -H "Authorization: Bearer $TOKEN" | jq .

          echo ""
          echo "=== Testing Cart Operations ==="
          echo "Adding item to cart..."
          curl -sf -X POST http://localhost:8080/api/v1/cart \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"item_id":"item-001"}' | jq .

          echo "Getting cart..."
          curl -sf http://localhost:8080/api/v1/cart \
            -H "Authorization: Bearer $TOKEN" | jq .

          echo "Removing item from cart..."
          curl -sf -X DELETE http://localhost:8080/api/v1/cart/item-001 \
            -H "Authorization: Bearer $TOKEN" | jq .

          echo ""
          echo "=== Testing Unauthorized Access ==="
          UNAUTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/notes)
          if [ "$UNAUTH_RESPONSE" = "401" ]; then
            echo "✓ Correctly returned 401 for unauthorized request"
          else
            echo "✗ Expected 401, got $UNAUTH_RESPONSE"
            exit 1
          fi

          echo ""
          echo "=== All Integration Tests Passed ==="
